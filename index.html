<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Forwarder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(145deg, #0b0e1a, #1a1f2f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(22, 28, 46, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 36px 24px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.6);
            text-align: center;
            color: #eef2ff;
            border: 1px solid rgba(255,215,0,0.15);
        }
        h1 { 
            font-size: 28px;
            background: linear-gradient(to right, #f6d365, #fda085);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .sub { color: #b0c4de; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 60px;
            border: none;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0b0e1a;
            margin: 8px 0;
            width: 100%;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(255,215,0,0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin: 16px 0;
            padding: 12px;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            font-size: 14px;
            color: #c8d6e5;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .status.success { background: rgba(46, 213, 115, 0.15); color: #2ed573; border: 1px solid #2ed57333; }
        .status.error { background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid #ff475733; }
        .status.loading { background: rgba(255, 215, 0, 0.1); color: #ffd700; border: 1px solid #ffd70033; }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .stat-box {
            background: rgba(255,255,255,0.04);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .stat-box .number { font-size: 28px; font-weight: 700; color: #ffd700; }
        .stat-box .label { font-size: 12px; color: #8a9bb5; }
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffd70033;
            border-top: 3px solid #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #4a5a77;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📸 Gallery Forwarder</h1>
        <p class="sub">Apni Gallery Telegram par bhejein</p>

        <button class="btn" id="selectBtn">📂 Gallery Access & Send</button>
        
        <div class="status" id="status">Ready</div>

        <div class="stats">
            <div class="stat-box">
                <div class="number" id="totalCount">0</div>
                <div class="label">Total Photos</div>
            </div>
            <div class="stat-box">
                <div class="number" id="sentCount">0</div>
                <div class="label">Sent to Telegram</div>
            </div>
        </div>

        <div class="footer">
            ⚡ Vercel + Telegram Bot
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
